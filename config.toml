# LocalMind Configuration
# Full docs: https://github.com/yourusername/localmind#configuration

[model]
# Path to your GGUF model file. Run `localmind download` to auto-fetch.
path = "~/.localmind/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf"
context_window = 4096
# Number of layers to offload to GPU. -1 = all layers. 0 = CPU only.
n_gpu_layers = -1
temperature = 0.1
max_tokens = 512
top_p = 0.95
repeat_penalty = 1.1

[embedder]
# Any sentence-transformers model name or local path.
model = "all-MiniLM-L6-v2"
batch_size = 64
# Device: "cpu", "cuda", "mps" (Apple Silicon)
device = "cpu"
normalize_embeddings = true

[retriever]
# Number of chunks to retrieve per query.
top_k = 6
# Hybrid search blend: 0.0 = BM25 only, 1.0 = dense vector only.
hybrid_alpha = 0.7
# Enable cross-encoder reranking (slower but higher accuracy).
rerank = false
rerank_model = "cross-encoder/ms-marco-MiniLM-L-6-v2"

[chunking]
# "fixed" | "sentence" | "semantic"
strategy = "semantic"
chunk_size = 512
chunk_overlap = 64
# Minimum characters for a chunk to be indexed (filters boilerplate).
min_chunk_length = 50

[index]
# Where FAISS index and metadata are stored.
path = "~/.localmind/index"
persist = true
# Rebuild entire index on next run (useful after chunking strategy changes).
force_rebuild = false

[api]
host = "127.0.0.1"
port = 8080
reload = false

[logging]
# "DEBUG" | "INFO" | "WARNING" | "ERROR"
level = "INFO"
format = "pretty"   # "pretty" for dev, "json" for production
